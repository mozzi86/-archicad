<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg version="1.1" viewBox="0 0 128 128" width="128" height="128" xmlns="http://www.w3.org/2000/svg">
  <!-- ELMonkey SAB — King Kong am Hochhaus. Stil wie das Tapir-Original:
       eine dunkle Silhouette (#202225), Aussparungen wirken hell.
       Dark-Mode-Variante erzeugt die CI via SVGColorChange.py. -->
  <!-- Badge mit ausgespartem Turm + Antenne (evenodd) -->
  <path fill="#202225" fill-rule="evenodd" d="
    M 64,0 C 28.7,0 0,28.7 0,64 c 0,35.3 28.7,64 64,64 c 35.3,0 64,-28.7 64,-64 C 128,28.7 99.3,0 64,0 Z
    M 46,16 L 82,16 L 82,124 L 46,124 Z
    M 62,6 L 66,6 L 66,16 L 62,16 Z" />
  <!-- Fenster oben (über Kong) -->
  <g fill="#202225">
    <rect x="50" y="20" width="6" height="5"/><rect x="61" y="20" width="6" height="5"/><rect x="72" y="20" width="6" height="5"/>
  </g>
  <!-- Fenster unten (unter Kong) -->
  <g fill="#202225">
    <rect x="50" y="96" width="6" height="5"/><rect x="61" y="96" width="6" height="5"/><rect x="72" y="96" width="6" height="5"/>
    <rect x="50" y="106" width="6" height="5"/><rect x="61" y="106" width="6" height="5"/><rect x="72" y="106" width="6" height="5"/>
    <rect x="50" y="116" width="6" height="5"/><rect x="61" y="116" width="6" height="5"/><rect x="72" y="116" width="6" height="5"/>
  </g>
  <!-- King Kong, dunkle Silhouette auf dem Turm -->
  <g fill="#202225">
    <!-- Arme hoch zu den Turmkanten -->
    <path d="M 56,56 C 52,48 49,40 46,33 L 52,29 C 56,37 59,45 62,53 Z"/>
    <path d="M 72,56 C 76,48 79,40 82,33 L 76,29 C 72,37 69,45 66,53 Z"/>
    <!-- Fäuste an den Kanten -->
    <circle cx="48" cy="30" r="5"/>
    <circle cx="80" cy="30" r="5"/>
    <!-- Ohren -->
    <circle cx="55" cy="42" r="3.5"/>
    <circle cx="73" cy="42" r="3.5"/>
    <!-- Kopf -->
    <circle cx="64" cy="44" r="9"/>
    <!-- Rumpf -->
    <ellipse cx="64" cy="68" rx="15" ry="17"/>
    <!-- Beine angezogen -->
    <path d="M 53,78 C 51,84 52,88 55,90 L 61,88 C 59,84 58,80 58,77 Z"/>
    <path d="M 75,78 C 77,84 76,88 73,90 L 67,88 C 69,84 70,80 70,77 Z"/>
    <!-- Füße -->
    <circle cx="56" cy="90" r="4"/>
    <circle cx="72" cy="90" r="4"/>
  </g>
  <!-- Gesicht: helle Aussparungen im Kopf -->
  <g fill="#FFFFFF">
    <circle cx="60.5" cy="42.5" r="1.8"/>
    <circle cx="67.5" cy="42.5" r="1.8"/>
    <path d="M 60,48 Q 64,51 68,48 Q 64,54 60,48 Z"/>
  </g>
</svg>
