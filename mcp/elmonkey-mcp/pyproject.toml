[project]
name = "elmonkey-mcp"
version = "0.1.0"
description = "MCP-Server fuer Archicad mit ELMonkey (Tapir + ELM_SAB) - Schwarz Architekturbuero"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2"]

[project.scripts]
elmonkey-mcp = "elmonkey_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elmonkey_mcp"]
